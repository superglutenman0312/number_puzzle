<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數字華容道 Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>數字華容道</h1>

    <div id="menu">
        <div class="menu-top-actions">
            <button class="btn help-btn" onclick="openHelp()">❓ 遊戲說明</button>
            <button class="btn leaderboard-btn" onclick="openLeaderboard()">🏆 排行榜</button>
        </div>
        </div>

    <div id="game-container">
        <div class="header">
            <div class="header-top">
                <button class="btn back-btn" onclick="exitGame()">返回</button>
                <div class="stats">
                    <span>步數: <span id="moves">0</span></span>
                    <span>時間: <span id="timer">00:00</span></span>
                </div>
            </div>
            <div id="best-record-display" class="header-bottom">
                歷史最佳: --:--
            </div>
        </div>
        <div id="board"></div>
    </div>

    <div id="leaderboard-container">
        <div class="header" style="flex-direction: row; justify-content: flex-start; background: transparent; box-shadow: none;">
            <button class="btn back-btn" onclick="closeLeaderboard()">返回</button>
        </div>
        <div class="lb-board">
            <select class="lb-selector" id="lb-type-select" onchange="fetchLeaderboard()" style="margin-bottom: 10px;">
                <option value="normal">人類榜</option>
                <option value="god">神仙榜</option>
            </select>
            
            <select class="lb-selector" id="lb-size-select" onchange="fetchLeaderboard()">
                <option value="3">3 x 3 排行榜</option>
                <option value="4">4 x 4 排行榜</option>
                <option value="5">5 x 5 排行榜</option>
                <option value="6">6 x 6 排行榜</option>
                <option value="7">7 x 7 排行榜</option>
                <option value="8">8 x 8 排行榜</option>
                <option value="9">9 x 9 排行榜</option>
                <option value="10">10 x 10 排行榜</option>
                <option value="11">11 x 11 排行榜</option>
                <option value="12">12 x 12 排行榜</option>
            </select>
            <ul class="lb-list" id="lb-content">
                <li style="text-align:center; color:#999; padding:20px;">載入中...</li>
            </ul>
        </div>
    </div>

    <div id="instruction-modal">
        <div class="modal-content">
            <h2>遊戲說明 💡</h2>
            <div class="instruction-text">
                <strong>🎯 遊戲目標：</strong><br>
                將打亂的數字，按照順序重新排列，並將空格留在最後一格。<br><br>
                <strong>👆 操作方式：</strong><br>
                點擊方塊即可移動。支援一次推動多格。<br><br>
                <span style="color:#ff3b30; font-size: 14px;">⚠️ 注意：時間會從您的「第一次移動」才開始計算！</span>
            </div>
            <label class="checkbox-label" id="checkbox-container">
                <input type="checkbox" id="dont-show-again"> 不再顯示此提示
            </label>
            <button class="btn" id="modal-action-btn" onclick="confirmInstruction()">開始挑戰</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
